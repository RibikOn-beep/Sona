name: Build APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Increment versionCode
        run: |
          CURRENT=$(node -e "console.log(require('./app.json').expo.android.versionCode)")
          NEW=$((CURRENT + 1))
          node -e "
            const fs = require('fs');
            const app = require('./app.json');
            app.expo.android.versionCode = $NEW;
            fs.writeFileSync('./app.json', JSON.stringify(app, null, 2));
          "
          echo "versionCode: $CURRENT → $NEW"

      - name: Expo Prebuild
        run: npx expo prebuild --platform android --clean

      - name: Fix release signing
        run: |
          sed -i 's/signingConfig signingConfigs.release/\/\/ signingConfig signingConfigs.release/' android/app/build.gradle
          echo "=== build.gradle lines 25-45 ==="
          sed -n '25,45p' android/app/build.gradle

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon
        env:
          GRADLE_OPTS: -Xmx4g -XX:MaxMetaspaceSize=512m

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sona-${{ github.ref_name }}-vc${{ github.run_number }}
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
